<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Restaurant Shift Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column — period bar, tab switch, then the rota grids scroll sideways inside their own frames, like the Excel sheet */
:root{
  --bg:#f5f4ee; --surface:#ffffff; --surface2:#edece3; --line:#d9d7ca; --fg:#22231c; --muted:#6a6b5f;
  --wk:#ecd04a; --wk-fg:#2b2600; --we:#5e8e38; --we-fg:#ffffff;
  --accent:#3b6a28; --accent-fg:#ffffff;
  --ok-bg:#e2eed4; --ok:#2e5a1b; --part-bg:#f6ebc3; --part:#6a5300; --off:#9e4433; --off-bg:#f4e1da;
  --warn:#c4512c; --shadow:0 10px 30px rgba(40,42,20,.18);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15160f; --surface:#1e1f17; --surface2:#292a21; --line:#393a2f; --fg:#ecebe1; --muted:#a3a495;
  --wk:#c8a928; --wk-fg:#1b1700; --we:#4c7a2e; --we-fg:#f2f7ec;
  --accent:#93c46c; --accent-fg:#13200a;
  --ok-bg:#23331a; --ok:#b5dc95; --part-bg:#3a3214; --part:#ebd27c; --off:#f0a390; --off-bg:#3b211b;
  --warn:#f08b65; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15160f; --surface:#1e1f17; --surface2:#292a21; --line:#393a2f; --fg:#ecebe1; --muted:#a3a495;
  --wk:#c8a928; --wk-fg:#1b1700; --we:#4c7a2e; --we-fg:#f2f7ec;
  --accent:#93c46c; --accent-fg:#13200a;
  --ok-bg:#23331a; --ok:#b5dc95; --part-bg:#3a3214; --part:#ebd27c; --off:#f0a390; --off-bg:#3b211b;
  --warn:#f08b65; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 96px;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.status{font-size:.8rem;color:var(--muted)}
.period{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;text-align:left}
.period .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.period .rng{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.period .chev{margin-left:auto;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface2);border-radius:12px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:600;font-size:.88rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--off);border-color:var(--off)}
.btn.sm{padding:6px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:.85rem;color:var(--muted);max-width:65ch;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.week{display:flex;flex-direction:column;gap:6px}
.wk-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center}
tr:last-child>*{border-bottom:0}
th:last-child,td:last-child{border-right:0}
thead th{font-weight:600;font-size:.72rem;padding:5px 4px;line-height:1.15}
thead th b{display:block;font-family:var(--f-display);font-size:1.05rem}
thead th.wd{background:var(--wk);color:var(--wk-fg)}
thead th.we{background:var(--we);color:var(--we-fg)}
th.nm{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;font-weight:600;font-size:.86rem;min-width:92px;max-width:110px;padding:0}
thead th.nm{background:var(--surface2);font-size:.72rem;color:var(--muted);padding:5px 8px;text-transform:uppercase;letter-spacing:.06em}
.nmbtn{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:transparent;padding:8px;text-align:left;font-weight:600;gap:1px;overflow:hidden}
.nmbtn small{font-weight:500;font-size:.68rem;color:var(--muted)}
.nmbtn small.ns{color:var(--warn)}
.cell{display:flex;align-items:center;justify-content:center;width:100%;min-width:78px;min-height:44px;border:0;background:transparent;font-family:var(--f-mono);font-size:.76rem;letter-spacing:-.02em;padding:4px 3px;position:relative}
.cell.full{background:var(--ok-bg);color:var(--ok);font-weight:500}
.cell.part{background:var(--part-bg);color:var(--part);font-weight:500}
.cell.off{color:var(--off);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--off-bg) 6px 8px)}
.cell.none{color:var(--muted)}
.cell.shift{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:inset 0 0 0 2px var(--accent)}
.cell.shift.manual::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cell.shift.clash{box-shadow:inset 0 0 0 2px var(--warn);color:var(--warn)}
.cell.free{color:var(--ok);opacity:.75}
td.hrs,th.hrs{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);min-width:44px;padding:4px}
tr.cov th.nm{font-size:.72rem;color:var(--muted);padding:6px 8px;text-transform:uppercase;letter-spacing:.06em;background:var(--surface2)}
tr.cov td{background:var(--surface2);font-family:var(--f-mono);font-size:.75rem;padding:6px 2px}
tr.cov td.short{color:var(--warn);font-weight:600}
tr.cov td.okc{color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.staffblock{display:flex;flex-direction:column;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.staffblock:last-of-type{border-bottom:0}
.staffrow{display:grid;grid-template-columns:1fr 74px auto;gap:8px;align-items:center}
.chip.fx{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.fx b{font-family:var(--f-body);font-weight:600}
.slotlist{display:flex;flex-direction:column;gap:6px}
.slotrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface2);border-radius:10px;padding:6px 6px 6px 12px}
.slotlbl{font-weight:600;font-size:.9rem}
.times{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:minmax(5.5em,auto) 1fr auto 1fr;gap:6px;align-items:center;font-size:.85rem}
.trow .inp{min-width:0}
.covc{line-height:1.5;white-space:nowrap}
.cell.part.fixedav{background:var(--ok-bg);color:var(--ok)}
.cell.part.fixedav::before{content:"📌";position:absolute;top:2px;left:3px;font-size:.55rem}
.covc.short{color:var(--warn);font-weight:600}
.covc.okc{color:var(--ok)}
.slottime{font-family:var(--f-mono);font-size:.88rem;font-weight:500}
.stepper{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.stepper span{min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
.stepper button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:1.05rem;font-weight:600;color:var(--fg)}
.btn.ghost{border-style:dashed;background:transparent;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
.inp.sm{padding:7px 8px}
.icons{display:flex;gap:4px}
.ic{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.colhead{display:grid;grid-template-columns:1fr 74px auto;gap:8px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 6px 5px 11px;font-family:var(--f-mono);font-size:.8rem}
.chip button{border:0;background:transparent;width:22px;height:22px;border-radius:50%;color:var(--muted)}
.addrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.addrow input[type=time]{width:auto;flex:1 1 100px}
.daytag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.75rem;font-weight:600}
.daytag.wd{background:var(--wk);color:var(--wk-fg)}
.daytag.we{background:var(--we);color:var(--we-fg)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,5,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);max-height:86vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.sheet .sub{font-size:.85rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 8px;font-family:var(--f-mono);font-size:.85rem;font-weight:500}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.fullo{background:var(--ok-bg);color:var(--ok)}
.opt.offo{background:var(--off-bg);color:var(--off)}
.opt.parto{background:var(--part-bg);color:var(--part)}
.sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.msg{font-size:.85rem;padding:8px 10px;border-radius:9px;background:var(--surface2)}
.msg.err{color:var(--off);background:var(--off-bg)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
textarea.inp{min-height:84px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%;text-align:left}
.pitem.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pitem small{color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <h1 id="h1">Shift Planner</h1>
    <div class="bar"><span class="status" id="status">Loading…</span><button class="btn sm" id="langBtn" data-act="lang" aria-label="Language">中文</button></div>
  </div>
  <button class="period" id="periodBtn" data-act="periods">
    <div><div class="lbl" id="plbl">Rota period · 3 weeks</div><div class="rng" id="periodLbl">—</div></div>
    <span class="chev" id="pchg">Change ▾</span>
  </button>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="avail" aria-selected="true">Availability</button>
    <button role="tab" data-tab="sched" aria-selected="false">Schedule</button>
    <button role="tab" data-tab="staff" aria-selected="false">Staff</button>
    <button role="tab" data-tab="shifts" aria-selected="false">Shifts</button>
  </div>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

}

function draft(p){
  const staff=config.staff;const hours={},wk={};
  p.sched=p.sched||{};p.locks=p.locks||{};p.avail=p.avail||{};
  for(const s of staff){
    const row=p.sched[s.id]||{};
    for(const d in row){if(!(p.locks[s.id]&&p.locks[s.id][d]))delete row[d]}
    p.sched[s.id]=row;hours[s.id]=0;wk[s.id]=[0,0,0];
    for(const d in row){const r=rng(row[d]);hours[s.id]+=r[1]-r[0];wk[s.id][Math.floor(d/7)]++}
  }
  for(const s of staff){
    const fx=s.fixed||{};
    for(const wd in fx){for(let w=0;w<3;w++){const d=w*7+(+wd);const a=p.avail[s.id]&&p.avail[s.id][d];
      if(p.sched[s.id][d]||a==='x')continue;const r=rng(fx[wd]);if(!r)continue;
      p.sched[s.id][d]=fx[wd];hours[s.id]+=r[1]-r[0];wk[s.id][w]++}}
  }
  let open=0;
  for(let d=0;d<21;d++){
    const w=Math.floor(d/7),wd=d%7,dd=dayCfg(wd);let am=+dd.needAm||0,pm=+dd.needPm||0;
    const used=new Set();
    for(const s of staff){const v=p.sched[s.id][d];if(!v)continue;used.add(s.id);const[a,b]=sides(v,wd);if(a)am--;if(b)pm--}
    while(am>0||pm>0){
      const opts=[];
      for(const s of staff){
        if(used.has(s.id)||(s.max&&wk[s.id][w]>=s.max))continue;
        const av=p.avail[s.id]&&p.avail[s.id][d];
        const types=[];if(am>0&&pm>0)types.push('full');if(am>0)types.push('am');if(pm>0)types.push('pm');
        for(const t of types){const f=fit(av,dd[t]);if(!f)continue;const v=ft(f.s)+'-'+ft(f.e);const[a,b]=sides(v,wd);
          const gain=(a&&am>0?1:0)+(b&&pm>0?1:0);if(!gain)continue;
          opts.push({s,v,a,b,len:f.e-f.s,score:gain*25+(f.full?0:-30)-hours[s.id]/60*6+Math.random()*8})}
      }
      if(!opts.length)break;
      opts.sort((x,y)=>y.score-x.score);const o=opts[0];
      p.sched[o.s.id][d]=o.v;used.add(o.s.id);hours[o.s.id]+=o.len;wk[o.s.id][w]++;if(o.a)am--;if(o.b)pm--;
    }
    open+=Math.max(am,0)+Math.max(pm,0);
  }
  return open;
}

}

  if(!r.ok){const err=new Error((j&&j.message)||txt||('HTTP '+r.status));err.badCode=/bad code/i.test(err.message);throw err}
  return j;
}
function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify({config,periods}))}catch(e){}}
async function flush(path){
  timers[path]=null;
  if(inflight[path]){again[path]=true;return}
  inflight[path]=true;
  try{
    cacheLocal();
    if(cloud()){
      const id=path==='app/config'?'config':'period:'+path.split('/')[1];
      const data=path==='app/config'?config:periods[path.split('/')[1]];
      if(data)await rpc('save_rota',{code:teamCode,doc_id:id,doc:JSON.parse(JSON.stringify(data))});
      else await rpc('delete_rota',{code:teamCode,doc_id:id});
      setStatus('synced');
    }else setStatus('savedLocal');
  }catch(e){
    setStatus('notSaved');if(e.badCode)askCode(true);
  }
  inflight[path]=false;
  if(again[path]){again[path]=false;return flush(path)}
  if(!timers[path])dirty.delete(path);
}

function loadLocal(){
  let got=false;try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);if(o.config){config=o.config;got=true}if(o.periods)periods=o.periods}}catch(e){}

async function pull(first){
  const rows=await rpc('get_rota',{code:teamCode});
  if(first&&(!rows||!rows.some(r=>r.id==='config'))){
    // empty database: upload what this device has
    await rpc('save_rota',{code:teamCode,doc_id:'config',doc:config});
    for(const k in periods)await rpc('save_rota',{code:teamCode,doc_id:'period:'+k,doc:periods[k]});
    return;
  }
  const seen=new Set();
  for(const r of rows||[]){
    if(r.id==='config'){if(!dirty.has('app/config')&&!inflight['app/config']){const d=r.data||{};config={staff:d.staff||[],days:d.days||clone(DEFAULT_DAYS)}}continue}
    if(r.id.startsWith('period:')){const k=r.id.slice(7);seen.add(k);if(!dirty.has('periods/'+k)&&!inflight['periods/'+k])periods[k]=r.data}
  }
  for(const k of Object.keys(periods))if(!seen.has(k)&&!dirty.has('periods/'+k)&&!inflight['periods/'+k])delete periods[k];
  cacheLocal();
}

/* ---------- local text reader (no AI) ---------- */
function parseLocal(text,start){
  const row={};let n=0;
  const parts=String(text).replace(/[;\n]+/g,',').split(',');
  for(let raw of parts){
    raw=raw.trim().toLowerCase();if(!raw)continue;
    const m=raw.match(/^(\d{1,2})(?:[\/.]\d{1,2})?\s*[:=\-–]?\s*(.+)$/);if(!m)continue;
    const day=+m[1];let val=m[2].trim();
    let idx=-1;for(let i=0;i<21;i++){if(dObj(addDays(start,i)).getUTCDate()===day){idx=i;break}}
    if(idx<0)continue;
    let v=null;
    if(/^(x|✕|off|nghỉ|nghi|no|休|休息|不)/.test(val))v='x';
    else if(/^(all|whole|full|cả ngày|ca ngay|全天|ok)/.test(val))v='all';
    else{val=val.replace(/\s/g,'').replace(/h(\d{2})/g,':$1').replace(/h/g,'');v=normRange(val)}
    if(v){row[idx]=v;n++}
  }
  return{row,n};
}

  const p=P(),box=$('#readmsg');if(!box)return;
  const dates=[...Array(21)].map((_,i)=>addDays(p.start,i)+' '+EN_DAYS[i%7]).join(', ');
  const src=file?'The attached screenshot shows a calendar of the days they can work. Vietnamese weekday labels may appear: T2=Mon, T3=Tue, T4=Wed, T5=Thu, T6=Fri, T7=Sat, CN=Sun. Chinese labels may appear: 周一/星期一=Mon … 周日/星期日=Sun. A cross or X means they cannot work that day. "Whole day" or 全天 means available all day. Times like 17h-21h30 mean 17:00-21:30.':'They wrote this message (it may be in any language, including Chinese or Vietnamese):\n"""\n'+text.slice(0,4000)+'\n"""';
  const prompt=`You are reading one restaurant employee's availability for a 3-week rota from ${p.start} to ${addDays(p.start,20)}. The dates in the period are: ${dates}.\n${src}\nReply with ONLY a JSON object. Keys are dates (YYYY-MM-DD) inside the period. Values are "off" (cannot work), "all" (available the whole day), or a 24-hour range "HH:MM-HH:MM". Leave out dates the source does not cover. Example: {"2026-10-05":"off","2026-10-06":"17:00-21:30","2026-10-08":"all"}`;
  box.innerHTML=`<div class="msg">${T('reading')}</div>`;
  sampleCtl=new AbortController();
  try{
    const opts={signal:sampleCtl.signal};if(file)opts.images=file;
    const res=await sampleFn.json(prompt,opts);
    const row={};let n=0;
    for(const k in res||{}){let i=Math.round((dObj(k)-dObj(p.start))/864e5);if(!(i>=0&&i<21))continue;const raw=String(res[k]).toLowerCase().trim();let v=null;
      if(/^(off|x|no)$/.test(raw))v='x';else if(/^(all|whole)/.test(raw))v='all';else v=normRange(raw);if(v){row[i]=v;n++}}
    if(!n){box.innerHTML=`<div class="msg err">${T('noDates')}</div>`;return}
    p.avail[sid]=Object.assign(p.avail[sid]||{},row);savePeriod();render();
    box.innerHTML=`<div class="msg">${T('filled')(n)}</div>`;
  }catch(e){
    const c=e&&e.code;const map={cancelled:'',rate_limited:T('errRate'),image_rejected:T('errImg'),invalid_json:T('errJson'),refused:T('errRefused'),session_expired:T('errSession')};
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){sampleFn=null;box.innerHTML=`<div class="msg err">${T('errOff')}</div>`;return}
    if(c==='images_unavailable'){box.innerHTML=`<div class="msg err">${T('errNoImg')}</div>`;return}
    const m=c in map?map[c]:T('errAny');box.innerHTML=m?`<div class="msg err">${m}</div>`:'';
  }finally{sampleCtl=null}
}

/* ---------- excel export ---------- */
function saveFile(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>rej();document.head.appendChild(s)})}
async function exportXlsx(){
  const p=P();let X;
  try{X=await loadXLSX()}catch(e){toast(T('xlsxLoad'));return}
  const aoa=[];
  for(let w=0;w<3;w++){
    aoa.push(['',...[0,1,2,3,4,5,6].map(i=>dObj(addDays(p.start,w*7+i)).getUTCDate())]);
    for(const s of config.staff)aoa.push([s.name,...[0,1,2,3,4,5,6].map(i=>{const v=(p.sched[s.id]||{})[w*7+i];return v?v:''})]);
    aoa.push([]);
  }
  const ws=X.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:12},...Array(7).fill({wch:13})];
  const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,T('sheetName'));
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});
  saveFile(`schedule-${p.start}.xlsx`,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));toast(T('xlsxSaved'));
}

/* ---------- events ---------- */
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb&&!e.target.closest('[data-act]')){tab=tb.dataset.tab;closeSheet();render();window.scrollTo({top:0});return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,p=P();
  const ctx=sheetCtx;
  switch(a){
    case 'lang':lang=lang==='zh'?'en':'zh';try{localStorage.setItem('shiftplanner.lang',lang)}catch(e){}closeSheet();render();break;
    case 'close':if(sheetCtx&&sheetCtx.code)break;closeSheet();break;
    case 'bkexport':saveFile('shift-planner-backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify({config,periods},null,1)],{type:'application/json'}));toast(T('bkDone'));break;
    case 'avclear':if(!canWrite)break;openSheet(`<h2>${T('avClearQ')}</h2><div class="sub">${T('avClearSub')}</div><div class="bar"><button class="btn pri" data-act="avclearkeep">${T('clearKeep')}</button><button class="btn danger" data-act="avclearall">${T('clearAllBtn')}</button><button class="btn" data-act="close">${T('cancel')}</button></div>`);break;
    case 'avclearkeep':p.avail={};fixedToAvail(p);savePeriod();closeSheet();render();toast(T('avClearedKept'));break;
    case 'avclearall':p.avail={};savePeriod();closeSheet();render();toast(T('cleared'));break;
    case 'fixavail':{if(!p||!canWrite)break;const n=fixedToAvail(p);savePeriod();render();toast(T('fixAvailDone')(n));break}
    case 'periods':sheetPeriods();break;
    case 'pick':cur=b.dataset.k;closeSheet();render();break;
    case 'pdel':$('#pdel').innerHTML=`<div class="confirm">${T('delPeriodQ')} <button class="btn sm danger" data-act="pdel2">${T('del')}</button><button class="btn sm" data-act="close">${T('keep')}</button></div>`;break;
    case 'pdel2':{const k=cur;delete periods[k];save('periods/'+k);pickPeriod();closeSheet();render();break}
    case 'go-sched':tab='sched';render();window.scrollTo({top:0});break;
    case 'av':if(canWrite)sheetAvail(b.dataset.s,+b.dataset.d);break;
    case 'row':if(canWrite)sheetRow(b.dataset.s);break;
    case 'sc':if(canWrite)sheetShift(b.dataset.s,+b.dataset.d);break;
    case 'setav':{const row=p.avail[ctx.sid]=p.avail[ctx.sid]||{};if(b.dataset.v)row[ctx.d]=b.dataset.v;else delete row[ctx.d];savePeriod();closeSheet();render();break}
    case 'setsh':{p.sched[ctx.sid]=p.sched[ctx.sid]||{};p.locks[ctx.sid]=p.locks[ctx.sid]||{};if(b.dataset.v){p.sched[ctx.sid][ctx.d]=b.dataset.v;p.locks[ctx.sid][ctx.d]=true}else{delete p.sched[ctx.sid][ctx.d];delete p.locks[ctx.sid][ctx.d]}savePeriod();closeSheet();render();break}
    case 'rowall':{const r={};for(let i=0;i<21;i++)r[i]='all';p.avail[ctx.sid]=r;savePeriod();render();toast(T('markedAll'));break}
    case 'rowclear':{p.avail[ctx.sid]={};savePeriod();render();toast(T('cleared'));break}
    case 'readtxt':{const t=$('#pastetxt').value.trim();if(!t){toast(T('pasteFirst'));break}const r=parseLocal(t,p.start);const box=$('#readmsg');if(!r.n){box.innerHTML=`<div class="msg err">${T('noDates')}</div>`;break}p.avail[ctx.sid]=Object.assign(p.avail[ctx.sid]||{},r.row);savePeriod();render();box.innerHTML=`<div class="msg">${T('filled')(r.n)}</div>`;break}
    case 'draft':{if(!canWrite)break;const open=draft(p);savePeriod();render();toast(T('drafted')(open));break}
    case 'clear':openSheet(`<h2>${T('clearQ')}</h2><div class="sub">${T('clearSub')}</div><div class="bar"><button class="btn danger" data-act="clear2">${T('clearBtn')}</button><button class="btn" data-act="close">${T('cancel')}</button></div>`);break;
    case 'clear2':p.sched={};p.locks={};savePeriod();closeSheet();render();break;
    case 'xlsx':exportXlsx();break;
    case 'up':{const i=+b.dataset.i;const s=config.staff;[s[i-1],s[i]]=[s[i],s[i-1]];save('app/config');render();break}
    case 'del':{const s=staffById(b.dataset.s);$('#delbox').innerHTML=`<div class="confirm">${T('removeQ')(esc(s.name))} <button class="btn sm danger" data-act="del2" data-s="${s.id}">${T('remove')}</button><button class="btn sm" data-act="delno">${T('keep')}</button></div>`;break}
    case 'delno':$('#delbox').innerHTML='';break;
    case 'del2':config.staff=config.staff.filter(x=>x.id!==b.dataset.s);save('app/config');render();break;
    case 'addfix':sheetFixed(b.dataset.s);break;
    case 'fxpre':{const[x,y]=b.dataset.v.split('-');$('#fxs').value=x;$('#fxe').value=y;document.querySelectorAll('[data-act="fxpre"]').forEach(o=>o.classList.toggle('on',o===b));break}
    case 'rmfix':{const s=staffById(b.dataset.s);if(s&&s.fixed){const v=s.fixed[b.dataset.w];delete s.fixed[b.dataset.w];save('app/config');if(p&&unFixedAvail(p,s.id,b.dataset.w,v))savePeriod();render()}break}
    case 'need':{const w=b.dataset.w,k=b.dataset.k;config.days=config.days||clone(DEFAULT_DAYS);const dd=config.days[w]=config.days[w]||clone(DEFAULT_DAYS[w]);dd[k]=Math.max(0,Math.min(20,(+dd[k]||0)+(+b.dataset.n)));save('app/config');render();break}
    case 'copymon':config.days=config.days||clone(DEFAULT_DAYS);for(const k of ['1','2','3'])config.days[k]=clone(dayCfg(0));save('app/config');render();toast(T('copied'));break;
    case 'resetslots':config.days=clone(DEFAULT_DAYS);save('app/config');render();break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='bkfile'&&e.target.files&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o.config||!o.config.staff)throw 0;config=o.config;periods=o.periods||{};cur=null;pickPeriod();cacheLocal();save('app/config');Object.keys(periods).forEach(k=>save('periods/'+k));render();toast(T('bkLoaded'))}catch(_){toast(T('bkBad'))}};fr.readAsText(e.target.files[0]);return}
  const t=e.target;if(t.dataset&&t.dataset.day!==undefined){const i=t.dataset.day,k=t.dataset.k,pt=+t.dataset.part;config.days=config.days||clone(DEFAULT_DAYS);const dd=config.days[i]=config.days[i]||clone(DEFAULT_DAYS[i]);const parts=dd[k].split('-');parts[pt]=t.value;const v=normRange(parts.join('-'));if(!v){toast(T('endAfter'));t.value=dd[k].split('-')[pt];return}dd[k]=v;save('app/config');return}
  if(e.target.id==='shot'&&e.target.files&&e.target.files[0]&&sheetCtx)readAvail(sheetCtx.sid,{file:e.target.files[0]});
});
document.addEventListener('paste',e=>{
  if(!sheetCtx||!sheetCtx.sid||!$('#pastetxt'))return;
  const items=[...((e.clipboardData&&e.clipboardData.items)||[])];const it=null;
  if(!it)return;const f=it.getAsFile();if(!f)return;e.preventDefault();readAvail(sheetCtx.sid,{file:f});
});

document.addEventListener('drop',e=>{
  if(!sheetCtx||!sheetCtx.sid||!$('#pastetxt'))return;const f=null;
  if(!f)return;e.preventDefault();readAvail(sheetCtx.sid,{file:f});
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.edit)return;const s=staffById(t.dataset.s);if(!s)return;
  if(t.dataset.edit==='name'){s.name=t.value.trim()||s.name}else{const n=parseInt(t.value,10);if(n>0)s.max=n;else delete s.max}
  save('app/config');
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.dataset.form,p=P(),ctx=sheetCtx;
  if(f==='code'){const v=$('#teamcode').value.trim();if(!v)return;teamCode=v;try{localStorage.setItem(CODE_KEY,v)}catch(_){}setStatus('loading');connect();return}
  if(f==='add'){const n=$('#newname').value.trim();if(!n)return;config.staff.push({id:'s'+Date.now().toString(36),name:n});save('app/config');render();setTimeout(()=>{const el=$('#newname');el&&el.focus()},0)}
  else if(f==='fix'){const s=staffById(ctx.sid);const v=normRange($('#fxs').value+'-'+$('#fxe').value);if(!v){toast(T('endAfter'));return}
    const wd=$('#fxday').value;const old=(s.fixed||{})[wd];s.fixed=s.fixed||{};s.fixed[wd]=v;save('app/config');if(p){if(old)unFixedAvail(p,s.id,wd,old);const n=fixedToAvail(p,{sid:s.id,wd});savePeriod();toast(T('fixAvailDone')(n))}closeSheet();render()}
  else if(f==='avcustom'){const v=normRange($('#avs').value+'-'+$('#ave').value);if(!v){toast(T('endAfter'));return}(p.avail[ctx.sid]=p.avail[ctx.sid]||{})[ctx.d]=v;savePeriod();closeSheet();render()}
  else if(f==='shcustom'){const v=normRange($('#shs').value+'-'+$('#she').value);if(!v){toast(T('endAfter'));return}(p.sched[ctx.sid]=p.sched[ctx.sid]||{})[ctx.d]=v;(p.locks[ctx.sid]=p.locks[ctx.sid]||{})[ctx.d]=true;savePeriod();closeSheet();render()}
  else if(f==='newp'){const iso=$('#pstart').value;if(!iso)return;if(dObj(iso).getUTCDay()!==1){toast(T('pickMon'));return}
    if(!periods[iso]){periods[iso]={start:iso,avail:{},sched:{},locks:{}};save('periods/'+iso)}cur=iso;tab='avail';closeSheet();render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!(sheetCtx&&sheetCtx.code)&&sheetCtx!==null&&$('#sheetHost').innerHTML)closeSheet()});
boot();
})();
</script>
